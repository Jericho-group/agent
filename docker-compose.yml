services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_app
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./admin:/app/admin
    networks:
      chatbot_prod:
        aliases:
          - chatbot

  caddy:
    image: caddy:2-alpine
    container_name: chatbot_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - chatbot
    networks:
      - chatbot_prod

networks:
  chatbot_prod:
    name: chatbot_prod_default
    external: true

volumes:
  caddy_data:
  caddy_config:
