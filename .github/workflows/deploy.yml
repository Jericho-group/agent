name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  deploy-test:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to TEST (217.149.25.34)
        env:
          SSHPASS: ${{ secrets.SSH_PASS_TEST }}
        run: |
          sudo apt-get install -yq sshpass rsync
          export SSHPASS
          export RSYNC_RSH="sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          HOST="${{ secrets.SSH_USER_TEST }}@${{ secrets.SSH_HOST_TEST }}"

          # Копирую chatbot_project (кроме .env, vendor, .git)
          rsync -az --delete \
                --filter='protect .env' --filter='protect .env.*' \
                --filter='protect docker-compose.yml' \
                --filter='protect Caddyfile' \
                --exclude='.env' --exclude='.env.*' --exclude='vendor/' \
                --exclude='.git/' --exclude='__pycache__/' --exclude='data/' \
                --exclude='bot404/' \
                --exclude='docker-compose.yml' --exclude='Caddyfile' \
                . "$HOST":/opt/chatbot/chatbot_project/

          # Копирую bot404 отдельно
          rsync -az --delete \
                --filter='protect .env' \
                --exclude='.env' --exclude='.git/' --exclude='node_modules/' \
                bot404/ "$HOST":/root/bot404/

          # Пересобираю и перезапускаю
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$HOST" \
            "cd /opt/chatbot/chatbot_project && docker compose up -d --build && \
             docker cp /opt/chatbot/chatbot_project/admin/index.html chatbot_app:/app/admin/index.html && \
             docker restart bot404 && \
             sleep 5 && docker ps --format '{{.Names}}: {{.Status}}' | grep -E '(chatbot|bot404|caddy|redis)'"

      - name: Smoke test TEST
        run: |
          # Проверяю что endpoint отвечает
          curl -sf https://217-149-25-34.sslip.io/admin -o /dev/null -w "test admin HTTP %{http_code}\n" || echo "warning: test smoke failed"

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production  # позволяет добавить manual approval через Settings→Environments
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to PROD (72.56.36.167)
        env:
          SSHPASS: ${{ secrets.SSH_PASS_PROD }}
        run: |
          sudo apt-get install -yq sshpass rsync
          export SSHPASS
          export RSYNC_RSH="sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          HOST="${{ secrets.SSH_USER_PROD }}@${{ secrets.SSH_HOST_PROD }}"

          rsync -az --delete \
                --filter='protect .env' --filter='protect .env.*' \
                --filter='protect docker-compose.yml' \
                --filter='protect Caddyfile' \
                --exclude='.env' --exclude='.env.*' --exclude='vendor/' \
                --exclude='.git/' --exclude='__pycache__/' --exclude='data/' \
                --exclude='bot404/' \
                --exclude='docker-compose.yml' --exclude='Caddyfile' \
                . "$HOST":/opt/chatbot/chatbot_project/

          rsync -az --delete \
                --filter='protect .env' \
                --exclude='.env' --exclude='.git/' --exclude='node_modules/' \
                bot404/ "$HOST":/root/bot404/

          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$HOST" \
            "cd /opt/chatbot/chatbot_project && docker compose up -d --build && \
             docker cp /opt/chatbot/chatbot_project/admin/index.html chatbot_app:/app/admin/index.html && \
             docker restart bot404 && \
             sleep 5 && docker ps --format '{{.Names}}: {{.Status}}' | grep -E '(chatbot|bot404|caddy|redis)'"

      - name: Smoke test PROD
        run: |
          # Пробую логин с реальными prod-данными (не факт что дойдёт — используем как sanity check)
          curl -sf -X POST -H "Content-Type: application/json" -H "Origin: https://admin.dirizher404.ru" \
            -d '{"login":"admin@prmonline.ru","password":"tgtKO83siR1CgA"}' \
            https://admin.dirizher404.ru/admin/api/login --max-time 30 \
            -o /dev/null -w "prod login HTTP %{http_code}\n" \
            || echo "warning: prod smoke failed"
